services:
  - type: web
    name: mbolo-grill-menu
    runtime: static
    buildCommand: echo "Site statique prêt"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
